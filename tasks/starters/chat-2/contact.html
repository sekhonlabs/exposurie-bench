<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write to me · Small Hours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Small Hours</a>
    <a href="about.html">About</a>
    <a href="contact.html">Write to me</a>
  </nav>

  <main>
    <h1>Write to me</h1>
    <p>Reply to any issue, or write to me here. I read everything.</p>

    <form name="contact" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="bot-field" class="contact">
      <p class="hidden"><label>Leave this empty <input name="bot-field"></label></p>
      <label for="name">Your name (optional)</label>
      <input id="name" name="name" type="text">
      <label for="from">Your email address (optional)</label>
      <input id="from" name="email" type="email">
      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>Written in the small hours</footer>
</body>
</html>
