/div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"article":{"id":48211,"slug":"your-backups-are-lying","title":"Your Backups Are Lying to You","subtitle":"A status code is not a restore.","author":{"name":"Ops Review Staff","slug":"staff"},"publishedAt":"2026-10-14T06:00:00.000Z","readingTime":6,"tags":["backups","databases","operations"],"body":[{"type":"paragraph","children":[{"text":"Every team I have worked with had backups. Fewer had restores. The difference only shows up on the worst day of the year, when someone types the restore command for the first time and finds out what the backup really holds."}]},{"type":"paragraph","children":[{"text":"A backup job that exits with status zero tells you that a program ran and stopped. It does not tell you that the file it wrote can be read, that it holds the tables you care about, or that it is newer than last Tuesday."}]},{"type":"paragraph","children":[{"text":"The fix is boring and it works: restore on a schedule. Pick a machine that is not production, pull the latest backup, open it, and run a query whose answer you know. Count the rows in your biggest table and compare the number with what production reported an hour ago."}]},{"type":"paragraph","children":[{"text":"Write down how long the restore took. That number is your real recovery time, and it is almost always longer than the one in the planning document. Large databases take a long time to copy, and nobody measures that until they have to."}]},{"type":"paragraph","children":[{"text":"Check what the backup leaves out. Uploaded files, search indexes, secrets and the configuration of the machine itself are often not in it, and each of them can turn a twenty-minute restore into a two-day rebuild."}]},{"type":"paragraph","children":[{"text":"Finally, make the restore loud. A test that fails in silence is a backup that lies with extra steps. Send the result somewhere a person will see it, and treat a missed restore test like a failed deploy."}]},{"type":"paragraph","children":[{"text":"None of this is new. It is just rarely done, because the day it pays off is a day you hope never comes."}]}]},"related":[{"id":90459,"slug":"notes-queues-knives-running-queues","title":"wind light trams","url":"https://ops-review.example/2023/05/sqlite-travel-quiet","image":"https://ops-review.example/images/d5707c6e992b6439df16c61d.jpg","readingTime":14},{"id":36502,"slug":"small-sqlite-solar-streams-production","title":"css radio trains","url":"https://ops-review.example/posts/transit-keepers-htmx","image":"https://ops-review.example/images/f93883b79362431ae295e7dc.jpg","readingTime":15},{"id":17606,"slug":"email-gardens-essays-trams","title":"history web energy photography guide solar","url":"https://ops-review.example/articles/19899-bread-chairs-indexes-roads-ferries","image":"https://ops-review.example/images/29dbb82a4241894abf7463a2.jpg","readingTime":6},{"id":10706,"slug":"notes-queues-time","title":"habits email writing tools quiet transit","url":"https://ops-review.example/articles/4270-css-coffee-night","image":"https://ops-review.example/images/b5cbc0302cf7009e4153aa23.jpg","readingTime":8},{"id":70819,"slug":"time-ink-history","title":"furniture essays furniture gardens compost design","url":"https://ops-review.example/posts/streams-radio-photography-gardens","image":"https://ops-review.example/images/3cf9c3ef69a9894c1620a7c5.jpg","readingTime":8},{"id":26209,"slug":"trains-coffee-paper-scheduling","title":"tools energy maps fixtures","url":"https://ops-review.example/design-web/small-photography-retries-europe","image":"https://ops-review.example/images/34d35507385a06d1b5cee180.jpg","readingTime":13},{"id":63981,"slug":"chairs-printing-lisbon-kitchens","title":"zones cities attention maps","url":"https://ops-review.example/posts/solar-gardens-transit-coverage","image":"https://ops-review.example/images/740dbf880560a848999eae0e.jpg","readingTime":17},{"id":18717,"slug":"writing-solar-memory-brid
