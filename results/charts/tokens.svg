<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Every input token, cached or not, with all three panels on one scale.</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Output is counted apart: a median of 439 to 658 tokens a run, alike in every condition.</text>
<text x="40" y="112" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">C is exposurie 1.3.1, the version on npm, beside the same runs of A, B and D.</text>
