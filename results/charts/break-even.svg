<svg xmlns="http://www.w3.org/2000/svg" width="880" height="730" viewBox="0 0 880 730" role="img" aria-label="Sessions until a brain pays for itself, by user and kind of session">
<title>Sessions until a brain pays for itself, by user and kind of session</title>
<rect x="0" y="0" width="880" height="730" fill="#FFFFFF"/>
<text x="40" y="46" font-family="Georgia, serif" font-size="24" fill="#141414">Sessions until a brain pays for itself</text>
<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">The tokens that built the brain, divided by the tokens a C session saves against B.</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Each pair of bars is C with exposurie 1.2.0, then C again with 1.2.0+b6855ee, its rebuilt read.</text>
<text x="40" y="136" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#141414" font-weight="bold">The developer: 4,008,581 tokens to build</text>
<text x="40" y="167" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">A question, areas 1–5</text>
<text x="40" y="185" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 90,335 tokens a session,</text>
<text x="40" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 107,833 with 1.2.0+b6855ee</text>
<rect x="300" y="153" width="300" height="22" fill="#E37D4E"/>
<text x="608" y="169" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">44.4 sessions, 1.2.0</text>
<rect x="300" y="181" width="251.4" height="22" fill="#E37D4E"/>
<text x="559.4" y="197" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">37.2 sessions, 1.2.0+b6855ee</text>
<text x="40" y="243" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">A work task, areas 6–7</text>
<text x="40" y="261" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 767,401 tokens a session,</text>
<text x="40" y="278" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 756,617 with 1.2.0+b6855ee</text>
<rect x="300" y="229" width="35.1" height="22" fill="#E37D4E"/>
<text x="343.1" y="245" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">5.2 sessions, 1.2.0</text>
<rect x="300" y="257" width="35.8" height="22" fill="#E37D4E"/>
<text x="343.8" y="273" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">5.3 sessions, 1.2.0+b6855ee</text>
<text x="40" y="319" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">Areas 1–7, as run here</text>
<text x="40" y="337" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 213,438 tokens a session,</text>
<text x="40" y="354" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 225,794 with 1.2.0+b6855ee</text>
<rect x="300" y="305" width="127" height="22" fill="#E37D4E"/>
<text x="435" y="321" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">18.8 sessions, 1.2.0</text>
<rect x="300" y="333" width="120.3" height="22" fill="#E37D4E"/>
<text x="428.3" y="349" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">17.8 sessions, 1.2.0+b6855ee</text>
<text x="40" y="410" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#141414" font-weight="bold">The delegator: 2,996,876 tokens to build</text>
<text x="40" y="441" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">A question, areas 1–5</text>
<text x="40" y="459" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 79,729 tokens a session,</text>
<text x="40" y="476" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 86,450 with 1.2.0+b6855ee</text>
<rect x="300" y="427" width="254.1" height="22" fill="#E37D4E"/>
<text x="562.1" y="443" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">37.6 sessions, 1.2.0</text>
<rect x="300" y="455" width="234.5" height="22" fill="#E37D4E"/>
<text x="542.5" y="471" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">34.7 sessions, 1.2.0+b6855ee</text>
<text x="40" y="517" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">A work task, areas 6–7</text>
<text x="40" y="535" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 531,004 tokens a session,</text>
<text x="40" y="552" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 530,999 with 1.2.0+b6855ee</text>
<rect x="300" y="503" width="37.8" height="22" fill="#E37D4E"/>
<text x="345.8" y="519" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">5.6 sessions, 1.2.0</text>
<rect x="300" y="531" width="37.8" height="22" fill="#E37D4E"/>
<text x="345.8" y="547" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">5.6 sessions, 1.2.0+b6855ee</text>
<text x="40" y="593" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">Areas 1–7, as run here</text>
<text x="40" y="611" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">C saves 260,239 tokens a session,</text>
<text x="40" y="628" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">and 264,270 with 1.2.0+b6855ee</text>
<rect x="300" y="579" width="77.7" height="22" fill="#E37D4E"/>
<text x="385.7" y="595" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">11.5 sessions, 1.2.0</text>
<rect x="300" y="607" width="76.4" height="22" fill="#E37D4E"/>
<text x="384.4" y="623" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414">11.3 sessions, 1.2.0+b6855ee</text>
<text x="40" y="684" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">B holds only what was said; a real long session also carries tool output, so B costs less here than</text>
<text x="40" y="704" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">the habit it stands for. Keeping a brain synced as its history grows costs tokens too, not counted here.</text>
</svg>
