<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Two long tasks, each one session filled to 500,000 tokens, then carried on three ways from there.</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Each dot is one check after the fork, filled when it held; the hand read overrides the script.</text>
