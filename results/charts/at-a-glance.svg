<svg xmlns="http://www.w3.org/2000/svg" width="880" height="688" viewBox="0 0 880 688" role="img" aria-label="exposurie-bench at a glance: every result in one view">
<title>exposurie-bench at a glance: every result in one view</title>
<rect x="0" y="0" width="880" height="688" fill="#FFFFFF"/>
<text x="40" y="46" font-family="Georgia, serif" font-size="24" fill="#141414">exposurie-bench at a glance</text>
<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Same tasks, model and tools in every condition. C is exposurie 1.3.1, the version on npm.</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">A is a fresh session, B the whole history in context, D a perfect memory of what each task needs.</text>
<rect x="40" y="124" width="390" height="118" fill="#F5F5F4"/>
<rect x="40" y="124" width="4" height="118" fill="#E37D4E"/>
<text x="62" y="156" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Right answers about the user's past</text>
<text x="62" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">21 of 21</text>
<text x="62" y="228" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">A 3 · B 21 · D 21, areas 1–7, one run each</text>
<rect x="450" y="124" width="390" height="118" fill="#F5F5F4"/>
<rect x="450" y="124" width="4" height="118" fill="#E37D4E"/>
<text x="472" y="156" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Tokens a run, median of areas 1–7</text>
<text x="472" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">24,175</text>
<text x="472" y="228" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">B 125,497 · A 13,095 · D 6,622</text>
<rect x="40" y="262" width="390" height="118" fill="#F5F5F4"/>
<rect x="40" y="262" width="4" height="118" fill="#E37D4E"/>
<text x="62" y="294" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Extra tokens on work that needs no past</text>
<text x="62" y="340" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">+267</text>
<text x="62" y="366" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">a run more than A, as measured (area 8)</text>
<rect x="450" y="262" width="390" height="118" fill="#F5F5F4"/>
<rect x="450" y="262" width="4" height="118" fill="#E37D4E"/>
<text x="472" y="294" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Made-up answers, in any condition</text>
<text x="472" y="340" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">0</text>
<text x="472" y="366" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">on questions the history never discussed</text>
<rect x="40" y="400" width="390" height="118" fill="#F5F5F4"/>
<rect x="40" y="400" width="4" height="118" fill="#E37D4E"/>
<text x="62" y="432" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Decisions carried from agent to agent</text>
<text x="62" y="478" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">5 of 6</text>
<text x="62" y="504" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">A 0 · D 6, by hand (part 13)</text>
<rect x="450" y="400" width="390" height="118" fill="#F5F5F4"/>
<rect x="450" y="400" width="4" height="118" fill="#E37D4E"/>
<text x="472" y="432" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Checks of its own layer that held</text>
<text x="472" y="478" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">6 of 6</text>
<text x="472" y="504" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">for both users (part 12)</text>
<rect x="40" y="538" width="390" height="118" fill="#F5F5F4"/>
<rect x="40" y="538" width="4" height="118" fill="#E37D4E"/>
<text x="62" y="570" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">A long session, after sync + fresh</text>
<text x="62" y="616" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">9 of 10 · 4 of 4</text>
<text x="62" y="642" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">long-2 with 1.3.0's read; level with /compact</text>
<rect x="450" y="538" width="390" height="118" fill="#F5F5F4"/>
<rect x="450" y="538" width="4" height="118" fill="#E37D4E"/>
<text x="472" y="570" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" font-weight="bold">Right answers across three releases</text>
<text x="472" y="616" font-family="Calibri, Carlito, Arial, sans-serif" font-size="36" fill="#141414" font-weight="bold">18 → 20 → 21</text>
<text x="472" y="642" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">1.2.0, 1.3.0's read and 1.3.1, of 21</text>
</svg>
