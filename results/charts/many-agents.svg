<text x="76" y="487" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#2B2B2B">The summary email counts highlights</text>
<text x="76" y="506" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">told to agent 3 of round 1; needed by 3 of round 2</text>
