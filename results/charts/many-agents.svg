<text x="660" y="582" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="middle">2</text>
<text x="780" y="555" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#141414" text-anchor="middle" font-weight="bold">6</text>
<text x="780" y="582" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="middle">5</text>
<text x="40" y="620" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">The three agreed on the highlights' shape</text>
<text x="540" y="620" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">no</text>
<text x="660" y="620" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" text-anchor="middle" font-weight="bold">no</text>
<text x="780" y="620" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">yes</text>
<text x="40" y="652" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">Agents that opened the brain</text>
<text x="540" y="652" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">no brain</text>
<text x="660" y="652" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" text-anchor="middle" font-weight="bold">3 of 3</text>
<text x="780" y="652" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">no brain</text>
<text x="40" y="684" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B">Commit messages in the developer's style</text>
<text x="540" y="684" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">1 of 3</text>
<text x="660" y="684" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" text-anchor="middle" font-weight="bold">3 of 3</text>
<text x="780" y="684" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">3 of 3</text>
