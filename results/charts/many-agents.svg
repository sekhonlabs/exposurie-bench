<text x="780" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="middle">perfect notes</text>
<text x="40" y="257" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#8C8C8C">K1</text>
<text x="76" y="257" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#2B2B2B">Highlights' shape: text, note, createdAt</text>
<text x="76" y="276" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">told to agent 1 of round 1; needed by 1, 2 and 3 of round 2</text>
