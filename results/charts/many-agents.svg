<svg xmlns="http://www.w3.org/2000/svg" width="880" height="910" viewBox="0 0 880 910" role="img" aria-label="Many agents, one job: the decisions round 2 kept, by condition">
<title>Many agents, one job: the decisions round 2 kept, by condition</title>
<rect x="0" y="0" width="880" height="910" fill="#FFFFFF"/>
<text x="40" y="46" font-family="Georgia, serif" font-size="24" fill="#141414">Many agents, one job</text>
<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Round 1: three agents built one feature with exposurie 1.3.1, each in its own copy.</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">In chat, each was also told decisions for later work, and not to build them.</text>
<text x="40" y="112" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Round 2: three new agents in each condition built the rest, blind, from one short ask each.</text>
<text x="40" y="132" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Each dot is one decision, filled when round 2's merged work kept it, by hand.</text>
<rect x="598" y="152" width="124" height="644" fill="#FCF0E9"/>
<text x="540" y="182" font-family="Georgia, serif" font-size="20" fill="#141414" text-anchor="middle">A</text>
<text x="540" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="middle">no memory</text>
<text x="660" y="182" font-family="Georgia, serif" font-size="20" fill="#141414" text-anchor="middle">C</text>
<text x="660" y="202" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="middle">exposurie 1.3.1</text>
