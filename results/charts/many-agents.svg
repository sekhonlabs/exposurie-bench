<text x="40" y="862" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">On 1.3.1, C's one miss: its Instapaper agent read the page that holds the highlights' shape,</text>
<text x="40" y="882" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">but the page worded it as a plan, and the agent left the highlights to another agent.</text>
<text x="40" y="902" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">D's notes word it as a rule. On 1.3.2, the sync wrote it as a rule, and the same agent kept it.</text>
<text x="40" y="922" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">Round 1's merge collided, and was repaired by hand before round 2 ran, with nothing of round 2 in it.</text>
