<text x="780" y="780" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">$0.54</text>
<text x="40" y="832" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">C's one miss: its Instapaper agent read the page that holds the highlights' shape, but the page</text>
<text x="40" y="852" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">words it as a plan, and the agent left Instapaper's highlights to another. D's notes word it as a rule.</text>
<text x="40" y="872" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B6B6B">Round 1's merge collided, and was repaired by hand before round 2 ran, with nothing of round 2 in it.</text>
