<text x="76" y="441" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#2B2B2B">Omnivore: read 90% or more counts as read</text>
<text x="76" y="460" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13" fill="#6B6B6B">told to agent 2 of round 1; needed by 2 of round 2</text>
