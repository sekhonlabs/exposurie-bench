<text x="540" y="748" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle">636,942</text>
<text x="660" y="748" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#141414" text-anchor="middle" font-weight="bold">866,701</text>
