<text x="40" y="46" font-family="Georgia, serif" font-size="24" fill="#141414">How C got here: three releases on the same tasks</text>
<text x="40" y="72" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Condition C ran again with each release of exposurie, on the same brains, with the same Claude</text>
<text x="40" y="92" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" fill="#6B6B6B">Code, model, tools and scoring. A, B and D have no exposurie, so their runs stand.</text>
